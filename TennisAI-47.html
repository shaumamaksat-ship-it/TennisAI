<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#07080c"/>
<meta name="mobile-web-app-capable" content="yes"/>
<title>TennisAI</title>
<style>
:root{
  --bg:#07080c; --card:#12151c; --card2:#181c24; --line:#232833;
  --text:#f4f6fb; --mute:#8b91a1; --dim:#5c6373;
  --green:#22c55e; --green2:#16a34a; --lime:#3dff8a; --gdim:rgba(34,197,94,.14);
  --red:#ef4444; --rdim:rgba(239,68,68,.14); --amber:#f5c14a; --adim:rgba(245,193,74,.12);
  --blue:#3b82f6; --live:#ff3b4a; --ball:#f5d76a;
  --radius:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100%}
body{max-width:430px;margin:0 auto;min-height:100dvh;position:relative;background:
  radial-gradient(900px 380px at 50% -10%, rgba(34,197,94,.08), transparent 55%), var(--bg);
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
img{display:block;object-fit:cover}
#app{min-height:100dvh;padding:0 0 calc(78px + env(safe-area-inset-bottom))}

.top{position:sticky;top:0;z-index:20;padding:12px 16px 10px;display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(180deg, rgba(7,8,12,.96), rgba(7,8,12,.78) 70%, transparent);backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:8px}
.ball{width:22px;height:22px;border-radius:50%;background:
  radial-gradient(circle at 35% 30%, #fff6b0, var(--ball) 45%, #c9a227);
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.12), 0 0 0 2px #1b1c12}
.brand h1{font-size:20px;margin:0;letter-spacing:-.03em}
.brand small{display:block;color:var(--mute);font-size:10px;font-weight:600;letter-spacing:.08em;margin-top:1px}
.icon-btn{width:36px;height:36px;border-radius:12px;background:var(--card);display:grid;place-items:center;color:var(--mute)}
.pro{background:linear-gradient(90deg,#2a2412,#3a3014);color:var(--ball);border:1px solid rgba(245,215,106,.25);
  height:28px;padding:0 10px;border-radius:999px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:4px}
.phero{margin:8px 16px 14px;padding:22px 16px 18px;border-radius:28px;position:relative;overflow:hidden;
  background:linear-gradient(165deg,#1c1810 0%,#12151c 48%,#0e1118 100%);border:1px solid rgba(245,215,106,.18)}
.phero:before{content:"";position:absolute;right:-40px;top:-50px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,215,106,.2),transparent 68%)}
.phero:after{content:"";position:absolute;left:-30px;bottom:-40px;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle,rgba(34,197,94,.12),transparent 70%)}
.pring{width:86px;height:86px;margin:0 auto 12px;border-radius:50%;padding:3px;position:relative;z-index:1;
  background:conic-gradient(from 200deg,#f5d76a,#7c6a2a,#f5d76a)}
.pring b{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:#14120e;
  font-size:28px;font-weight:800;letter-spacing:-.04em;color:#f5d76a}
.pname{text-align:center;font-size:22px;font-weight:800;letter-spacing:-.03em;position:relative;z-index:1}
.pmail{text-align:center;color:var(--mute);font-size:13px;margin:4px 0 14px;position:relative;z-index:1}
.pstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.pstat{background:rgba(8,10,14,.55);border:1px solid rgba(255,255,255,.06);border-radius:16px;padding:10px 6px;text-align:center}
.pstat b{display:block;font-size:18px;font-weight:800}
.pstat span{display:block;color:var(--mute);font-size:10px;margin-top:3px;letter-spacing:.04em}
.prow{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.pico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:#1c2230;flex:0 0 auto}
.prow .tt{font-weight:700;font-size:14px}
.prow .ss{color:var(--mute);font-size:12px;margin-top:2px}
.chev{margin-left:auto;color:var(--dim);font-size:18px}
.toggle{width:44px;height:26px;border-radius:999px;background:#2a3140;position:relative;margin-left:auto;border:0}
.toggle.on{background:#16a34a}
.toggle i{width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:3px;left:3px;transition:left .18s}
.toggle.on i{left:21px}
.fav-btn{position:absolute;top:10px;left:10px;width:32px;height:32px;border-radius:10px;background:rgba(12,14,18,.72);
  color:var(--dim);display:grid;place-items:center;z-index:3;border:1px solid var(--line)}
.fav-btn.on{color:#f5d76a;border-color:rgba(245,215,106,.35)}
.mc .watch.fab{right:10px;left:auto}
.ins{font-size:12px;color:#c5ccd8;margin-top:8px;line-height:1.4}
.mom{display:flex;gap:4px;margin:10px 0 4px}
.mom i{flex:1;height:7px;border-radius:99px;background:#2a3140}
.mom i.a{background:var(--green)}
.mom i.b{background:var(--red)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;font-size:10px;font-weight:800;margin:2px 4px 2px 0;letter-spacing:.04em}
.tag.warn{background:var(--adim);color:var(--amber)}
.tag.hot{background:var(--rdim);color:#ff8b94}
.tag.ok{background:var(--gdim);color:var(--green)}
.reason{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.reason:last-child{border-bottom:0}
.reason b{color:var(--green);white-space:nowrap}
.nbadge{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--live);
  color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.icon-btn{position:relative}
.note-row{padding:12px 0;border-bottom:1px solid var(--line)}
.note-row:last-child{border-bottom:0}
.note-row.unread .tt{color:var(--ball)}
.sheet-card{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(430px,100%);z-index:60;
  background:linear-gradient(180deg,#1a1e28,#10141b);border-top:1px solid var(--line);border-radius:24px 24px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 60px rgba(0,0,0,.45)}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55}

.pad{padding:0 16px 18px}
.hero{background:linear-gradient(180deg,#1a1510 0%, #141820 55%, #12151c 100%);
  border:1px solid #2a241c;border-radius:24px;padding:14px 14px 16px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-30px;top:-40px;width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle, rgba(245,193,74,.18), transparent 70%)}
.hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.fire{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.04em}
.badge{background:var(--live);color:#fff;font-size:10px;font-weight:800;padding:3px 7px;border-radius:6px;letter-spacing:.04em}
.badge.g{background:var(--green);color:#05210f}
.vs-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px}
.pcol{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.ava{width:72px;height:72px;border-radius:50%;border:2px solid #2c3340;background:#1c2430}
.ava.sm{width:44px;height:44px}
.ava.md{width:56px;height:56px}
.pname{font-weight:700;font-size:13px;line-height:1.2}
.meta{color:var(--mute);font-size:11px;display:flex;align-items:center;gap:4px;justify-content:center}
.flag{width:14px;height:10px;border-radius:2px;object-fit:cover}
.vs{color:var(--dim);font-size:12px;font-weight:800}
.score-xl{text-align:center;font-size:34px;font-weight:800;letter-spacing:.02em;margin:10px 0 2px}
.score-xl span{opacity:.35;margin:0 6px;font-weight:600}
.subline{text-align:center;color:var(--mute);font-size:12px}
.dotg{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;margin-right:6px;box-shadow:0 0 8px var(--green)}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0 12px}
.kpi{background:rgba(0,0,0,.28);border:1px solid #262b36;border-radius:14px;padding:10px 8px;text-align:center}
.kpi .l{color:var(--mute);font-size:10px;margin-bottom:4px}
.kpi .v{font-weight:800;font-size:13px}
.kpi .s{color:var(--mute);font-size:10px;margin-top:2px}
.btn{width:100%;height:48px;border-radius:14px;background:linear-gradient(180deg,#3dff7a,#16a34a);
  color:#05210f;font-weight:800;font-size:13px;letter-spacing:.04em}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.row{display:flex;align-items:center;justify-content:center;gap:8px}

.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 0 10px}
.sec h2{margin:0;font-size:16px}
.link{color:var(--mute);font-size:12px;font-weight:600}
.chips{display:flex;gap:8px;overflow:auto;padding-bottom:4px;margin-bottom:10px}
.chip{flex:0 0 auto;height:32px;padding:0 12px;border-radius:999px;background:var(--card);color:var(--mute);
  font-size:12px;font-weight:700;border:1px solid var(--line)}
.chip.on{background:#fff;color:#111}

.ml{display:flex;flex-direction:column;gap:8px}
.mc{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;text-align:left;width:100%}
.mc-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;color:var(--mute);font-size:11px}
.pair{display:flex;align-items:center;gap:10px}
.pair .nm{font-weight:650;font-size:14px}
.sc{margin-left:auto;display:flex;align-items:center;gap:10px;font-weight:800}
.mc-h{padding-left:34px;padding-right:42px}
.board{display:grid;grid-template-columns:30px 34px 40px;gap:4px;margin-left:auto;align-items:center;text-align:center}
.board .h{font-size:8px;color:var(--dim);letter-spacing:.08em;font-weight:700}
.board .c{height:26px;border-radius:8px;background:#1a1f28;border:1px solid #2a3140;display:grid;place-items:center;
  font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.board .c.pt{color:#f5c14a;border-color:rgba(245,193,74,.28);background:#1c1810}
.board .c.on{box-shadow:0 0 0 1px rgba(245,215,106,.35)}
.mc-ai{margin-top:8px;text-align:right;font-size:12px;font-weight:700;color:var(--green)}
.mc-body{display:flex;align-items:center;gap:10px}
.mc-players{flex:1;min-width:0}
.ai{color:var(--green);font-size:12px;font-weight:800;min-width:52px;text-align:right}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--live);box-shadow:0 0 8px var(--live);display:inline-block}

.mhead{padding:8px 8px 0}
.mhead .navrow{display:flex;align-items:center;justify-content:space-between}
.livepill{display:flex;align-items:center;gap:6px;color:#fff;font-size:12px;font-weight:800}
.tour{text-align:center;color:var(--mute);font-size:12px;margin:8px 0 10px}
.tabs{display:flex;gap:4px;overflow:auto;padding:0 8px 8px}
.tab{flex:0 0 auto;padding:8px 10px;font-size:11px;font-weight:700;color:var(--mute);border-bottom:2px solid transparent}
.tab.on{color:#fff;border-bottom-color:var(--green)}
.card{background:linear-gradient(180deg,#161a22,#12151c);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin:0 16px 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
.lbl{font-size:11px;color:var(--mute);font-weight:700;letter-spacing:.04em}
.pred{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pred .n{font-size:13px;font-weight:700}
.pred .pct{font-size:28px;font-weight:800;margin-top:4px}
.pred .pct.g{color:var(--green)}
.pred .pct.r{color:var(--red)}
.frow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0}
.frow + .frow{border-top:1px solid var(--line)}
.frow .who{font-weight:750;font-size:14px}
.frow .kp{font-weight:800;font-size:18px}
.mini-bar{height:6px;border-radius:99px;overflow:hidden;display:flex;background:#222;margin:6px 0 4px}
.mini-bar i,.mini-bar b{height:100%;display:block}
.bar{height:8px;border-radius:99px;overflow:hidden;display:flex;background:#222;margin-top:10px}
.bar i{background:var(--green);height:100%}
.bar b{background:var(--red);height:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--card2);border-radius:14px;padding:10px}
.stat .k{font-size:11px;color:var(--mute)}
.stat .vv{font-weight:800;margin-top:4px;font-size:13px}
.sig{display:flex;gap:8px;align-items:flex-start;padding:7px 0;font-size:13px}
.sig i{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:0 0 auto}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td{padding:8px 0;border-bottom:1px solid var(--line)}
.tbl td:last-child,.tbl th:last-child{text-align:right}
.tbl th{color:var(--mute);font-size:11px;text-align:left;padding-bottom:6px}

.exhero{background:linear-gradient(180deg,#102018,#12151c);border:1px solid #1e3a28;border-radius:24px;padding:16px;position:relative;overflow:hidden}
.comet{position:absolute;right:8px;top:8px;width:88px;height:88px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%, #c6ff6a, #22c55e 45%, transparent 70%);filter:blur(0);opacity:.95}
.comet:after{content:"🎾";position:absolute;right:10px;bottom:8px;font-size:34px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45))}
.exbig{font-size:42px;font-weight:800;letter-spacing:-.03em;margin:6px 0}
.risk{display:inline-flex;align-items:center;gap:6px;background:var(--gdim);color:var(--green);border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800}
.exm{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-top:10px;display:flex;gap:10px;align-items:center}
.exm .right{margin-left:auto;text-align:right}
.riskrow{display:flex;gap:8px;margin-top:8px}
.rbox{flex:1;border-radius:12px;padding:8px;text-align:center;font-size:11px;font-weight:800;background:#15181f;border:1px solid var(--line);color:var(--mute)}
.rbox.on.low{background:var(--gdim);color:var(--green);border-color:#14532d}
.rbox.on.mid{background:var(--adim);color:var(--amber);border-color:#5b4a16}
.rbox.on.hi{background:var(--rdim);color:#f87171;border-color:#7f1d1d}

.bot{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:430px;z-index:30;
  display:grid;grid-template-columns:repeat(5,1fr);background:rgba(10,12,16,.94);border-top:1px solid var(--line);
  padding:6px 6px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(18px)}
.bot a,.bot button{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--dim);font-size:10px;font-weight:700;padding:6px 0;background:none;border:0;width:100%}
.bot a.on,.bot button.on{color:var(--green)}
.empty{text-align:center;color:var(--mute);padding:40px 16px}
.auth{display:grid;gap:10px}
input{height:46px;border-radius:14px;border:1px solid var(--line);background:#0e1116;color:#fff;padding:0 12px;font:inherit}
.note{color:var(--mute);font-size:12px;line-height:1.45}
.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.45}}
canvas.mom{width:100%;height:140px;display:block}
.clock{font-variant-numeric:tabular-nums;color:var(--mute);font-size:12px;text-align:center;margin-top:4px}
.sb{margin:10px 16px 0;background:
  radial-gradient(120% 80% at 0% 0%, rgba(245,215,106,.08), transparent 42%),
  linear-gradient(180deg,#171c16,#10131a 58%);
  border:1px solid #2a3326;border-radius:22px;padding:14px 14px 12px;
  box-shadow:0 16px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.05)}
.sb-row{display:flex;align-items:center;gap:8px;padding:10px 8px;border-radius:16px}
.sb-row + .sb-row{margin-top:4px}
.sb-row.serving{background:linear-gradient(90deg,rgba(245,215,106,.14),rgba(34,197,94,.05) 55%,transparent)}
.sb-name{flex:1;font-weight:750;font-size:15px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-width:0}
.sb-name .nm{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rk{font-size:11px;font-weight:650;color:#9aa3b5;letter-spacing:.2px}
.sb-box{min-width:28px;height:28px;border-radius:8px;background:#1b2029;display:grid;place-items:center;font-weight:800;font-size:14px}
.sb-box.on{background:#16321f;color:var(--green);box-shadow:0 0 0 1px #1f6a38}
.sb-pt{min-width:30px;color:var(--amber);font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.ava-wrap{position:relative;width:44px;height:44px;flex:0 0 auto}
.ava-wrap img{width:44px;height:44px;border-radius:50%}
.ava-wrap.on img{box-shadow:0 0 0 2px #f5d76a,0 0 18px rgba(245,215,106,.45)}
.ava-wrap.on:after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(245,215,106,.45);animation:ring 1.5s ease-out infinite}
@keyframes ring{from{transform:scale(.86);opacity:.9}to{transform:scale(1.18);opacity:0}}
.serve-ico{width:15px;height:15px;flex:0 0 auto;border-radius:50%;position:relative;display:inline-block;vertical-align:middle;margin-left:6px;
  background:radial-gradient(circle at 32% 28%,#fff6b8,#f0c93a 46%,#b8860b);
  box-shadow:inset -2px -2px 0 rgba(80,50,0,.18),0 0 8px rgba(245,193,74,.35);animation:toss .95s ease-in-out infinite}
.serve-ico:before,.serve-ico:after{content:"";position:absolute;border:1.6px solid #1f6b32;border-radius:50%;width:10px;height:14px;top:-1px}
.serve-ico:before{left:-3px;border-right-color:transparent;border-top-color:transparent}
.serve-ico:after{right:-3px;border-left-color:transparent;border-bottom-color:transparent}
@keyframes toss{50%{transform:translateY(-2px)}}
.sheet{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet-card{width:100%;max-width:430px;height:78dvh;background:#0c0f14;border-top-left-radius:22px;border-top-right-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet-h b{font-size:14px}
.sheet iframe{flex:1;width:100%;border:0;background:#000}
.watch{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:12px;background:#1a2030;border:1px solid #2a3344;color:#e8eef8;font-size:12px;font-weight:800}
.watch.fab{position:absolute;right:12px;top:12px;width:36px;height:36px;padding:0;justify-content:center;border-radius:12px}
.btn-row{display:flex;gap:8px;margin-top:4px}
.btn-row .btn{flex:1}
.logo{display:block;filter:drop-shadow(0 6px 16px rgba(34,197,94,.28))}
.logo.spin .seam{animation:seam 2.8s linear infinite}
@keyframes seam{to{transform:rotate(360deg)}}
.live-dot{animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.35;transform:scale(.82)}}
.btn{transition:transform .18s ease, filter .18s ease}
.btn:active{transform:scale(.98);filter:brightness(.95)}
.mc,.card,.hero,.exm,.exhero{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.gate{position:fixed;inset:0;z-index:80;background:#05060a;display:flex;align-items:stretch;justify-content:center}
.gate.out{animation:gateOut .55s ease forwards}
@keyframes gateOut{to{opacity:0;transform:scale(1.04);pointer-events:none}}
.splash,.welcome{width:100%;max-width:430px;min-height:100dvh;position:relative;overflow:hidden}
.splash{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.splash .orb{position:absolute;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(34,197,94,.28),transparent 68%);filter:blur(8px);animation:orb 3.2s ease-in-out infinite}
@keyframes orb{50%{transform:scale(1.12);opacity:.7}}
.court-bg{position:absolute;inset:18% 12%;border:1px solid rgba(34,197,94,.18);border-radius:18px;opacity:.45}
.court-bg:before,.court-bg:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:rgba(34,197,94,.2)}
.court-bg:after{left:0;right:0;top:50%;bottom:auto;width:auto;height:1px}
.splash .mark{position:relative;z-index:2;animation:pop 900ms cubic-bezier(.2,1.2,.3,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.splash h1{position:relative;z-index:2;margin:18px 0 6px;font-size:34px;letter-spacing:-.04em}
.splash p{position:relative;z-index:2;color:var(--mute);margin:0;font-size:14px}
.splash .load{margin-top:28px;width:120px;height:3px;border-radius:99px;background:#1a1f28;overflow:hidden;position:relative;z-index:2}
.splash .load i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3dff8a,#22c55e);animation:load 1.5s ease forwards}
@keyframes load{to{width:100%}}
.welcome{display:none;flex-direction:column;padding:28px 22px calc(28px + env(safe-area-inset-bottom))}
.welcome.on{display:flex}
.welcome .skip{align-self:flex-end;color:var(--mute);font-size:13px;font-weight:700}
.welcome .art{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:240px}
.welcome .glow{position:absolute;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(34,197,94,.22),transparent 70%)}
.welcome h2{margin:8px 0 10px;font-size:28px;letter-spacing:-.03em;line-height:1.15}
.welcome .dots{display:flex;gap:6px;margin:16px 0 18px}
.welcome .dots b{width:7px;height:7px;border-radius:50%;background:#2a3140}
.welcome .dots b.on{width:18px;border-radius:99px;background:var(--green)}
.wcard{width:86%;background:linear-gradient(180deg,#162019,#12151c);border:1px solid #1e3a28;border-radius:24px;padding:18px;animation:rise .5s ease both}
.wcard .row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;font-weight:700}
.fly{position:absolute;font-size:28px;animation:fly 2.8s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translate(-40px,18px)}50%{transform:translate(48px,-22px)}}
</style>

function parsePerson(name){
  const raw=String(name||"").replace(/\./g," ").trim();
  const parts=raw.split(/\s+/).filter(Boolean);
  const skip=new Set(["de","del","da","dos","van","von","di","le","la"]);
  if(!parts.length) return {full:"",last:"",ini:"",key:""};
  let ini=parts[0], last=parts[parts.length-1];
  if(parts[0].length<=2 && parts.length>=2){ini=parts[0]; last=parts.slice(1).join(" ");}
  else if(parts.length>=2 && skip.has(norm(parts[parts.length-2]))) last=parts.slice(-2).join(" ");
  return {full:norm(raw), last:norm(last), ini:ini.replace(".","").charAt(0), key:norm(last)};
}
function ru(name){
  const raw=String(name||"").trim();
  if(!raw) return "Игрок";
  const p=parsePerson(raw);
  if(FONBET[p.full]) return FONBET[p.full];
  if(FONBET[p.last]) return FONBET[p.last];
  if(FONBET[p.key]) return FONBET[p.key];
  const bits=p.full.split(" ");
  for(let i=bits.length;i>=1;i--){
    const k=bits.slice(-i).join(" ");
    if(FONBET[k]) return FONBET[k];
  }
  return translitName(raw);
}
function translitName(name){

  const m={a:"А",b:"Б",c:"К",d:"Д",e:"Е",f:"Ф",g:"Г",h:"Х",i:"И",j:"Й",k:"К",l:"Л",m:"М",n:"Н",o:"О",p:"П",q:"К",r:"Р",s:"С",t:"Т",u:"Ю",v:"В",w:"В",x:"К",y:"Я",z:"З"};
  return m[x]||(x?x.toUpperCase():"");
}
function fonbetWord(s){
  let t=norm(s);
  t=t.replace(/sch/g,"щ").replace(/shch/g,"щ").replace(/zh/g,"ж").replace(/kh/g,"х")
    .replace(/tch/g,"ч").replace(/ch/g,"ч").replace(/sh/g,"ш").replace(/ts/g,"ц")
    .replace(/yu/g,"ю").replace(/ya/g,"я").replace(/yo/g,"ё").replace(/ye/g,"е")
    .replace(/je/g,"е").replace(/dj/g,"дж").replace(/dz/g,"дз").replace(/ph/g,"ф")
    .replace(/th/g,"т").replace(/ck/g,"к").replace(/qu/g,"кв").replace(/oyi/g,"ойи");
  t=t.replace(/ic$|ich$|ić$/g,"ич").replace(/ski$|sky$/g,"ски");
  let out="";
  for(let i=0;i<t.length;i++){
    const ch=t[i], nxt=t[i+1]||"";
    if(ch==="c"){out+=(/[eiy]/.test(nxt)?"с":"к"); continue;}
    out+=({a:"а",b:"б",d:"д",e:"е",f:"ф",g:"г",h:"х",i:"и",j:"й",k:"к",l:"л",m:"м",n:"н",o:"о",p:"п",q:"к",r:"р",s:"с",t:"т",u:"у",v:"в",w:"в",x:"кс",y:"и",z:"з"}[ch]||ch);
  }
  out=out.replace(/оии$/,"ойи").replace(/ии$/,"и").replace(/ез$/,"ес");
  return out?out[0].toUpperCase()+out.slice(1):out;
}
function ruTour(t){
  let s=String(t||"Турнир");
  s=s.replace(/Winston-?Salem Open/gi,"Уинстон-Сейлем")
    .replace(/Monterrey Open/gi,"Монтеррей")
    .replace(/Men'?s Qualification/gi,"мужчины, квалификация")
    .replace(/Women'?s Qualification/gi,"женщины, квалификация")
    .replace(/Philadelphia, USA/gi,"Филадельфия")
    .replace(/Jamacia|Jamaica/gi,"Ямайка")
    .replace(/WTA Challenger · /gi,"WTA Challenger · ")
    .replace(/ATP Challenger · /gi,"ATP Challenger · ");
  return s;
}

function flag(cc){return "https://flagcdn.com/w40/"+(cc||"un")+".png"}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function rankScore(r){return clamp(102-r*2.05,18,99)}
function vstat(st, side, key){
  const x=st && st[side] && st[side][key];
  return x==null?null:x;
}
function liveAnalyze(m){
  const a=findPlayer(m.p1), b=findPlayer(m.p2);
  const st=m.stats||{p1:{},p2:{}};
  const factors=[];
  const add=(name,edge,w,why)=>{
    if(edge==null || !w) return;
    factors.push({name,edge,w,why,score:edge*w});
  };
  const diffPct=(k,scale)=>{
    const x=vstat(st,"p1",k), y=vstat(st,"p2",k);
    if(x==null||y==null) return null;
    return clamp((x-y)/scale,-1,1);
  };
  add("Подача", diffPct("servePts",28) ?? diffPct("firstWon",30), 0.22,
    (()=>{const x=vstat(st,"p1","servePts"), y=vstat(st,"p2","servePts");
      if(x==null||y==null) return "мало данных по подаче";
      return x>=y?("П1 держит подачу "+Math.round(x)+"% vs "+Math.round(y)+"%"):("П2 держит подачу "+Math.round(y)+"% vs "+Math.round(x)+"%");
    })());
  add("Приём", diffPct("retPts",22) ?? diffPct("ret1",24), 0.16,
    (()=>{const x=vstat(st,"p1","retPts"), y=vstat(st,"p2","retPts");
      if(x==null||y==null) return "приём ещё копится";
      return x>=y?("П1 лучше принимает "+Math.round(x)+"%"):("П2 лучше принимает "+Math.round(y)+"%");
    })());
  add("Очки", diffPct("points",18), 0.20,
    (()=>{const x=vstat(st,"p1","points"), y=vstat(st,"p2","points");
      if(x==null||y==null) return "очки матча не пришли";
      return "очки "+Math.round(x)+"% — "+Math.round(y)+"%";
    })());
  add("Брейки", diffPct("breaks",35), 0.12,
    (()=>{const x=vstat(st,"p1","breaks"), y=vstat(st,"p2","breaks");
      if(x==null||y==null) return "брейк-поинты без данных";
      return "реализация брейков "+Math.round(x)+"% / "+Math.round(y)+"%";
    })());
  const ace= (vstat(st,"p1","aces")||0)-(vstat(st,"p2","aces")||0);
  const df= (vstat(st,"p2","df")||0)-(vstat(st,"p1","df")||0);
  if(vstat(st,"p1","aces")!=null || vstat(st,"p1","df")!=null)
    add("Эйсы / ошибки", clamp((ace+df)/8,-1,1), 0.08, "эйсы "+(vstat(st,"p1","aces")||0)+":"+(vstat(st,"p2","aces")||0)+" · двойные "+(vstat(st,"p1","df")||0)+":"+(vstat(st,"p2","df")||0));
  const lead=(m.sets[0]-m.sets[1])*3+(m.games[0]-m.games[1])*0.55;
  add("Счёт", clamp(lead/8,-1,1), m.status==="live"?0.10:0.04, m.status==="live"?("счёт "+m.sets[0]+":"+m.sets[1]+" по сетам, "+m.games[0]+":"+m.games[1]+" в сете"):"матч не начался");
  if(m.h2h && m.h2h.n>=2){
    const hr=m.h2h.w1/(m.h2h.w1+m.h2h.w2||1);
    add("H2H", clamp((hr-0.5)*2,-1,1), 0.06, "личные "+m.h2h.w1+":"+m.h2h.w2);
  }
  const eye=courtEye(m);
  if(eye && eye.n){
    add("Ход матча", clamp(eye.edge,-1,1), 0.22, eye.why);
    if(eye.streak) add("Серия", eye.streak>0?0.6:-0.6, 0.08, eye.streakWhy);
  }
  const thin=!vstat(st,"p1","servePts") && !(eye&&eye.n>=4);
  add("Рейтинг", clamp((rankScore(a.rank)-rankScore(b.rank))/50,-1,1), thin?0.16:0.05,
    "#"+a.rank+" против #"+b.rank+(a.rank<b.rank?" · П1 выше":b.rank<a.rank?" · П2 выше":""));
  const pre=clamp(((a.form-(b.form))+(rankScore(a.rank)-rankScore(b.rank))*0.4)/40,-1,1);
  add("Форма до матча", pre, m.status==="live"?(eye&&eye.n?0.02:0.06):0.16, "форма до матча как фон");
  const ue1=vstat(st,"p1","ue"), ue2=vstat(st,"p2","ue");
  const w1=vstat(st,"p1","winners"), w2=vstat(st,"p2","winners");
  if(ue1!=null || w1!=null){
    const clean=((w1||0)-(ue1||0))-((w2||0)-(ue2||0));
    add("Чистота удара", clamp(clean/8,-1,1), 0.14, "виннеры "+(w1||0)+":"+(w2||0)+" · ошибки "+(ue1||0)+":"+(ue2||0));
  }
  const pr=pressureRead(m);
  if(pr) add("Давление", pr.edge, 0.16, pr.why);
  const tw=factors.reduce((s,f)=>s+f.w,0)||1;
  let edge=factors.reduce((s,f)=>s+f.score,0)/tw;
  let model=clamp(50+edge*18,22,78);
  if(m.mktP1!=null){
    const mw=m.status==="live"?(thin?0.42:0.28):0.55;
    model=clamp(model*(1-mw)+m.mktP1*mw,22,78);
  }
  const ranked=[...factors].sort((x,y)=>Math.abs(y.score)-Math.abs(x.score));
  const why=ranked.slice(0,4).map(f=>f.why);
  return {model,factors,why,st};
}
function brainLoad(){
  try{state.brain=JSON.parse(localStorage.getItem("tennisai.brain")||"{}")}catch{state.brain={}}
  state.brain.players=state.brain.players||{};
  state.brain.matches=state.brain.matches||{};
  state.brain.calib=state.brain.calib||{n:0,hit:0};
}
function brainSave(){
  try{
    const mm=state.brain.matches||{};
    const keep={};
    const ids=Object.keys(mm).slice(-30);
    for(const id of ids) keep[id]=mm[id];
    localStorage.setItem("tennisai.brain",JSON.stringify({players:state.brain.players,calib:state.brain.calib,matches:keep}));
  }catch{}
  cloudPush();
}
function cloudOn(){
  return /^https?:$/.test(location.protocol) && !!(location.hostname) && location.hostname!=="null";
}
function cloudPull(){
  if(!cloudOn()) return Promise.resolve();
  return fetch("/api/brain").then(r=>r.ok?r.json():null).then(b=>{
    if(!b||typeof b!=="object") return;
    brainLoad();
    state.brain.players=Object.assign({},b.players||{},state.brain.players||{});
    if(b.calib && (b.calib.n||0)>=((state.brain.calib||{}).n||0)) state.brain.calib=b.calib;
    state.brain.matches=Object.assign({},b.matches||{},state.brain.matches||{});
    try{localStorage.setItem("tennisai.brain",JSON.stringify({players:state.brain.players,calib:state.brain.calib,matches:state.brain.matches}))}catch{}
    state.cloud=true;
  }).catch(()=>{state.cloud=false});
}
function cloudPush(){
  if(!cloudOn()) return;
  try{
    fetch("/api/brain",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(state.brain||{})}).then(r=>{state.cloud=r.ok}).catch(()=>{state.cloud=false});
  }catch{}
}
let _dbp=null;
function dbReady(){
  if(_dbp) return _dbp;
  if(typeof indexedDB==="undefined") return Promise.resolve(null);
  _dbp=new Promise(res=>{
    try{
      const r=indexedDB.open("tennisai-db",1);
      r.onupgradeneeded=()=>{
        const db=r.result;
        ["matches","players","preds","results"].forEach(n=>{
          if(!db.objectStoreNames.contains(n)) db.createObjectStore(n,{keyPath:"id"});
        });
      };
      r.onsuccess=()=>res(r.result);
      r.onerror=()=>res(null);
    }catch{res(null)}
  });
  return _dbp;
}
function dbPut(store,row){
  if(!row||row.id==null) return;
  dbReady().then(db=>{
    if(!db) return;
    db.transaction(store,"readwrite").objectStore(store).put(row);
  }).catch(()=>{});
}
function dbAll(store){
  return dbReady().then(db=>new Promise(ok=>{
    if(!db) return ok([]);
    const q=db.transaction(store,"readonly").objectStore(store).getAll();
    q.onsuccess=()=>ok(q.result||[]);
    q.onerror=()=>ok([]);
  }));
}
function refreshDbStats(){
  Promise.all([dbAll("matches"),dbAll("preds"),dbAll("results"),dbAll("players")]).then(([m,p,r,pl])=>{
    const hit=r.filter(x=>x.ok).length;
    state.dbStats={matches:m.length,preds:p.length,results:r.length,players:pl.length,acc:r.length?Math.round(hit/r.length*100):0};
    const box=document.querySelector("[data-db-box]");
    if(box) box.innerHTML=`<div class="frow"><div class="note">матчи</div><div class="who">${state.dbStats.matches}</div></div>
      <div class="frow"><div class="note">прогнозы</div><div class="who">${state.dbStats.preds}</div></div>
      <div class="frow"><div class="note">результаты</div><div class="who">${state.dbStats.results}</div></div>
      <div class="frow"><div class="note">точность</div><div class="who">${state.dbStats.acc}%</div></div>`;
  }).catch(()=>{});
}
function pkey(n){return String(n||"").toLowerCase().replace(/[^a-zа-я0-9]+/gi," ").trim()}
function bumpBrain(name, pack){
  const k=pkey(name); if(!k) return;
  const p=state.brain.players[k]||{hold:[],win:0,n:0};
  if(pack.hold!=null) p.hold=(p.hold||[]).concat(pack.hold).slice(-24);
  p.win=(p.win||0)+(pack.win||0);
  p.n=(p.n||0)+1;
  state.brain.players[k]=p;
}
function watchCourt(old, now){
  if(!now||isFb(now)) return;
  brainLoad();
  const mem=state.brain.matches[now.id]||{log:[],snap:""};
  const snap=(now.sets||[0,0]).join("x")+"|"+(now.games||[0,0]).join(":");
  if(snap===mem.snap && now.status!=="finished") {state.brain.matches[now.id]=mem; return}
  const pg=(old&&old.games)||mem.g||[0,0];
  const ng=now.games||[0,0];
  const ps=(old&&old.sets)||mem.s||[0,0];
  const ns=now.sets||[0,0];
  let w=null;
  if(ns[0]>ps[0]) w=0;
  else if(ns[1]>ps[1]) w=1;
  else if(ng[0]>pg[0]) w=0;
  else if(ng[1]>pg[1]) w=1;
  if(w!=null){
    const srv=old&&old.server!=null?old.server:now.server;
    const hold=srv===w;
    mem.log=(mem.log||[]).concat({w,srv,hold,g:ng.slice(),s:ns.slice(),t:Date.now()}).slice(-40);
    bumpBrain(w===0?now.p1:now.p2,{win:1,hold:hold?1:0});
    bumpBrain(w===1?now.p1:now.p2,{win:0,hold:hold?0:1});
    if(now.status==="finished"){
      const c=state.brain.calib;
      c.n=(c.n||0)+1;
      const pred=mem.pred;
      if(pred!=null) c.hit=(c.hit||0)+(pred===w?1:0);
    }
    if(mem.predGame!=null){
      mem.gameN=(mem.gameN||0)+1;
      mem.gameHit=(mem.gameHit||0)+(mem.predGame===w?1:0);
    }
  }
  if(now.status==="live"){
    try{
      const v=verdict(now);
      mem.pred=v.match;
      mem.predGame=v.gameSide;
    }catch{
      mem.pred= now.mktP1!=null?(now.mktP1>=50?0:1):mem.pred;
    }
  }
  mem.snap=snap; mem.g=ng.slice?ng.slice():ng; mem.s=ns.slice?ns.slice():ns;
  state.brain.matches[now.id]=mem;
  if(Date.now()-(state.lastBrain||0)>4000){state.lastBrain=Date.now(); brainSave()}
}
function courtEye(m){
  const mem=(state.brain&&state.brain.matches&&state.brain.matches[m.id])||{};
  const log=mem.log||[];
  if(!log.length) return null;
  const last=log.slice(-8);
  const w1=last.filter(x=>x.w===0).length;
  const w2=last.length-w1;
  const h1=last.filter(x=>x.srv===0);
  const h2=last.filter(x=>x.srv===1);
  const hold1=h1.length?h1.filter(x=>x.hold).length/h1.length:null;
  const hold2=h2.length?h2.filter(x=>x.hold).length/h2.length:null;
  let streak=0, sw=last[last.length-1].w;
  for(let i=last.length-1;i>=0;i--){if(last[i].w===sw) streak++; else break}
  const edge=(w1-w2)/Math.max(last.length,1) + ((hold1||0.5)-(hold2||0.5))*0.8;
  const why="в матче геймы "+w1+":"+w2+(hold1!=null?(" · удержание "+Math.round(hold1*100)+"% / "+Math.round((hold2||0)*100)+"%"):"");
  return {n:last.length,w1,w2,hold1,hold2,edge,why,streak:sw===0?streak:-streak,streakWhy:(sw===0?"П1":"П2")+" взял "+streak+" гейм подряд",log:last};
}
function trackProb(m,p1){
  state.probHist=state.probHist||{};
  const h=state.probHist[m.id]||{prev:p1,now:p1};
  if(Math.abs(p1-(h.now||p1))>=1.5){h.prev=h.now;h.now=p1}
  else h.now=p1;
  state.probHist[m.id]=h;
  return h;
}
function lastTape(m){
  const log=(((state.brain||{}).matches||{})[m.id]||{}).log||[];
  return log.slice(-5).map(x=>x.w===0?"A":"B");
}
function psychFlags(m){
  const st=m.stats||{p1:{},p2:{}};
  const flags=[];
  const df1=st.p1&&st.p1.df||0, df2=st.p2&&st.p2.df||0;
  if(df1>=3 && df1>df2+1) flags.push("П1 сыпет двойные");
  if(df2>=3 && df2>df1+1) flags.push("П2 сыпет двойные");
  const e=courtEye(m);
  if(e && Math.abs(e.streak)>=3) flags.push(e.streakWhy);
  const pr=typeof pressureRead==="function"?pressureRead(m):null;
  if(pr) flags.push(pr.why);
  return flags;
}
function fatigueFlags(m){
  const sets=(m.setHistory||[]).length;
  const games=((m.setHistory||[]).reduce((s,x)=>s+(+x[0]||0)+(+x[1]||0),0))+((m.games||[0,0])[0]+(m.games||[0,0])[1]);
  if(sets>=2 && games>=22) return "длинный матч · "+games+" геймов";
  if(sets>=2) return "третий сет · усталость возможна";
  return "";
}
function insightLine(m,ev){
  if(isFb(m)) return "";
  const e=courtEye(m);
  const flags=psychFlags(m);
  const fat=fatigueFlags(m);
  if(e && Math.abs(e.streak)>=3) return ru(e.streak>0?m.p1:m.p2)+" взял "+Math.abs(e.streak)+" гейма подряд · momentum сместился";
  if(flags[0]) return flags[0];
  if(fat) return fat;
  if(ev && !ev.skip) return ru(ev.fav===0?m.p1:m.p2)+" "+Math.round(Math.max(ev.p1,ev.p2))+"%";
  return "";
}
function aiReasons(m,ev){
  const out=[];
  const e=courtEye(m);
  if(e&&e.n) out.push({t:"ход корта", v:"геймы "+e.w1+":"+e.w2+(e.streakWhy?" · "+e.streakWhy:"")});
  const st=m.stats||{p1:{},p2:{}};
  if(st.p1&&st.p1.servePts!=null) out.push({t:"подача", v:Math.round(st.p1.servePts)+"% / "+Math.round(st.p2.servePts||0)+"%"});
  if(st.p1&&st.p1.firstWon!=null) out.push({t:"выигрыш 1-й", v:Math.round(st.p1.firstWon)+"% / "+Math.round(st.p2.firstWon||0)+"%"});
  if(st.p1&&st.p1.secondWon!=null) out.push({t:"выигрыш 2-й", v:Math.round(st.p1.secondWon)+"% / "+Math.round(st.p2.secondWon||0)+"%"});
  if(st.p1&&st.p1.retPts!=null) out.push({t:"приём", v:Math.round(st.p1.retPts)+"% / "+Math.round(st.p2.retPts||0)+"%"});
  if(st.p1&&st.p1.breaks!=null) out.push({t:"брейки", v:Math.round(st.p1.breaks)+"% / "+Math.round(st.p2.breaks||0)+"%"});
  if(st.p1&&(st.p1.aces!=null||st.p1.df!=null)) out.push({t:"эйсы / двойные", v:(st.p1.aces||0)+":"+(st.p2.aces||0)+" / "+(st.p1.df||0)+":"+(st.p2.df||0)});
  if(m.h2h&&m.h2h.n) out.push({t:"очные", v:m.h2h.w1+":"+m.h2h.w2+(m.h2h.n?(" · "+m.h2h.n+" матчей"):"")});
  if(m.h2h&&m.h2h.tape1&&m.h2h.tape1.length) out.push({t:"форма П1", v:m.h2h.tape1.slice(0,5).join(" ")});
  if(m.h2h&&m.h2h.tape2&&m.h2h.tape2.length) out.push({t:"форма П2", v:m.h2h.tape2.slice(0,5).join(" ")});
  const fat=fatigueFlags(m); if(fat) out.push({t:"усталость", v:fat});
  (psychFlags(m)||[]).forEach(f=>out.push({t:"давление", v:f}));
  const hist=trackProb(m, ev&&ev.p1);
  if(hist && hist.prev!=null && Math.abs(hist.now-hist.prev)>=2)
    out.push({t:"сдвиг вероятности", v:Math.round(hist.prev)+"% → "+Math.round(hist.now)+"%"});
  if(m.mktP1!=null) out.push({t:"рынок", v:Math.round(m.mktP1)+"% / "+Math.round(m.mktP2)+"%"});
  return out.slice(0,10);
}
function bestPicks(){
  return sportMatches().filter(m=>m.status!=="finished").map(m=>({m,e:evaluate(m)})).filter(x=>!x.e.skip && x.e.diff>=8).sort((a,b)=>b.e.diff-a.e.diff).slice(0,4);
}
function scenarioPack(m,ev){
  const s=m.sets||[0,0], g=m.games||[0,0];
  const eye=courtEye(m);
  const st=m.stats||{p1:{},p2:{}};
  const p1=ev.p1, p2=ev.p2;
  const hold1=st.p1&&st.p1.servePts, hold2=st.p2&&st.p2.servePts;
  const br1=st.p1&&st.p1.breaks, br2=st.p2&&st.p2.breaks;
  const df1=(st.p1&&st.p1.df)||0, df2=(st.p2&&st.p2.df)||0;
  const dry1=s[1]>=1?0:clamp(p1*0.42+(s[0]-s[1])*22+(g[0]-g[1])*3,6,74);
  const dry2=s[0]>=1?0:clamp(p2*0.42+(s[1]-s[0])*22+(g[1]-g[0])*3,6,74);
  const n0=ru(m.p1), n1=ru(m.p2);
  const srv=m.server;
  const rk1=m.rank1||(findPlayer(m.p1).rank), rk2=m.rank2||(findPlayer(m.p2).rank);
  const mkt=m.mktP1;
  const winThisSet=side=>{

function upcoming24(){
  const now=Date.now(), h=now+36*3600*1000;
  const all=sportMatches().filter(m=>m.status!=="finished"&&!m.complete&&m.status!=="live");
  const near=all.filter(m=>{
    const t=m.startAt||now+2*3600*1000;
    return t<=h;
  });
  return near.length?near:all;
}
function tourId(m){return norm(m.tournament||"turnir")}
function tourList(){
  const rows=sportMatches().filter(m=>m.status!=="finished"&&!m.complete)
    .filter(m=>!state.exLevel||state.exLevel==="ALL"||m.tour===state.exLevel);
  const map={};
  for(const m of rows){
    const id=tourId(m);
    if(!map[id]) map[id]={id,name:ruTour(m.tournament),n:0,live:0,tour:m.tour};
    map[id].n++;
    if(m.status==="live") map[id].live++;
  }
  return Object.values(map).sort((a,b)=>b.n-a.n);
}
function tourLevelCounts(){
  const rows=sportMatches().filter(m=>m.status!=="finished"&&!m.complete);
  const c={ALL:rows.length};
  for(const m of rows){c[m.tour]=(c[m.tour]||0)+1}
  return c;
}
function expressPool(){
  const all=sportMatches().filter(m=>m.status!=="finished"&&!m.complete);
  const pre=all.filter(m=>m.status!=="live");
  let pool=pre.length?pre:all.filter(m=>m.status==="live"&&m.oddsP1);
  if(state.exLevel && state.exLevel!=="ALL") pool=pool.filter(m=>m.tour===state.exLevel);
  if(state.exTour && state.exTour!=="ALL"){
    const t=pool.filter(m=>tourId(m)===state.exTour);
    if(t.length) return t;
    return all.filter(m=>tourId(m)===state.exTour && (!state.exLevel||state.exLevel==="ALL"||m.tour===state.exLevel));
  }
  if(state.exLevel && state.exLevel!=="ALL") return pool.length?pool:all.filter(m=>m.tour===state.exLevel);
  return upcoming24();
}
function packSafe(cands){
  const wins=cands.filter(c=>c.market==="Победа матча" && c.odds>=1.20 && c.odds<=1.72)
    .sort((a,b)=>a.odds-b.odds);
  const legs=[];
  for(const c of wins){
    if(legs.some(l=>l.matchId===c.matchId)) continue;
    legs.push(c);
    if(legs.length>=3) break;
  }
  if(legs.length<2) return null;
  return legs;
}

  if(isFb(m)) return (m.goals||m.sets||[0,0]).join(" : ");
  const hist=(m.setHistory||[]).map(s=>s[0]+"-"+s[1]);
  if(m.status==="live"){
    hist.push(m.games[0]+"-"+m.games[1]);

  if(m.sets && (m.sets[0]||m.sets[1])) return m.sets[0]+"-"+m.sets[1];

  return {matchId:m.id, tournament:m.tournament, time:kickoff(m), p1:m.p1, p2:m.p2, short1:m.short1, short2:m.short2};
}
function mkLeg(m, market, pick, side, prob){
  const p=clamp(prob,28,88);
  return Object.assign(legBase(m),{
    market, pick, side:side||"", odds:decimalOdds(p), prob:Math.round(p*10)/10
  });
}
function marketsFor(m){
  if(isFb(m)){
    const ev=evaluateFb(m);
    const list=[
      mkLeg(m,"Победа матча", ru(m.p1)+" победит","П1", ev.p1),
      mkLeg(m,"Ничья","Ничья","X", ev.px),
      mkLeg(m,"Победа матча", ru(m.p2)+" победит","П2", ev.p2)
    ];
    const even=ev.diff<10;
    list.push(mkLeg(m,"Тотал голов", even?"Больше 2.5":"Меньше 2.5","", even?54:56));
    list.push(mkLeg(m,"Обе забьют", even?"Да":"Нет","", even?53:55));
    if(m.status==="live"){
      const g=(m.goals||m.sets||[0,0]);
      const tot=g[0]+g[1];
      list.push(mkLeg(m,"Тотал голов", tot>=3?"Больше 3.5":"Больше 1.5","", tot>=3?48:58));
    }
    return list.map(x=>{x.odds=decimalOdds(x.prob); return x;});
  }
  const ev=evaluate(m);
  const side=ev.fav===0?"П1":"П2";
  const name=ru(ev.fav===0?m.p1:m.p2);
  const other=ru(ev.fav===0?m.p2:m.p1);
  const pWin=ev.fav===0?ev.p1:ev.p2;
  const even=ev.diff<8;
  const list=[];
  list.push(mkLeg(m,"Победа матча", name+" победит", side, pWin));
  list.push(mkLeg(m,"Первый сет", side+" первый сет · "+name, side, clamp(pWin-5,52,76)));
  if(even){
    list.push(mkLeg(m,"Тотал сетов","Больше 2.5","",58));
    list.push(mkLeg(m,"Тотал геймов","Больше 22.5","",56));
    list.push(mkLeg(m,"Точный счёт","2-1","",42));
  }else{
    list.push(mkLeg(m,"Тотал сетов","Меньше 2.5","",clamp(50+ev.diff*0.8,52,70)));
    list.push(mkLeg(m,"Тотал геймов","Меньше 21.5","",clamp(51+ev.diff*0.35,52,66)));
    list.push(mkLeg(m,"Точный счёт",(ev.fav===0?"2-0":"0-2")+" · "+name, side, clamp(30+ev.diff*0.7,32,54)));
  }
  list.push(mkLeg(m,"Фора сетов", side+" (−1.5) · "+name, side, clamp(pWin-18,34,52)));
  const f=forecast(m);
  list.push(mkLeg(m,"Фора геймов", f.handicap.pick, f.handicap.side, f.handicap.prob));
  list.push(mkLeg(m,"Тотал геймов в сете", f.setGames.pick+" · "+(m.status==="live"?f.setNo+"-й сет":"1-й сет"), "", f.setGames.prob));
  return list.map(x=>{x.odds=decimalOdds(x.prob); return x;});
}
function winLegFromMarket(m){
  if(!m||m.status==="live"||m.status==="finished"||m.complete) return null;
  if(!(m.oddsP1>1.01 && m.oddsP2>1.01)) return null;
  const fav=m.oddsP1<=m.oddsP2?0:1;
  const odds=Number(fav===0?m.oddsP1:m.oddsP2);
  const other=Number(fav===0?m.oddsP2:m.oddsP1);
  if(odds<1.18 || odds>1.95) return null;
  if(other/odds<1.05) return null;
  const prob=Number(fav===0?m.mktP1:m.mktP2);
  return Object.assign(legBase(m),{
    market:"Победа матча",
    pick:ru(fav===0?m.p1:m.p2)+" победит",
    side:fav===0?"П1":"П2",
    odds:Math.round(odds*100)/100,
    prob:Math.round((prob||(100/odds))*10)/10,
    book:m.oddsBook||"рынок"
  });
}
function collectCandidates(matches){
  const out=[];
  for(const m of matches||[]){
    const leg=winLegFromMarket(m);
    if(leg) out.push(leg);
  }
  out.sort((a,b)=>a.odds-b.odds||b.prob-a.prob);
  return out;
}
async function loadExpressOdds(){
  if(state.sport==="football") return;
  if(state.enrichingOdds) return;
  const need=expressPool().filter(m=>m.status!=="live" && !(m.oddsP1>1.01));
  if(!need.length){buildExpress();return}
  state.enrichingOdds=true;
  try{
    for(let i=0;i<Math.min(need.length,16);i+=4){
      await Promise.all(need.slice(i,i+4).map(m=>enrichMatch(m).catch(()=>{})));
    }
  }finally{state.enrichingOdds=false}
  buildExpress();
}
function packLegs(pool, skip, minK, cap, nLegs, uniqueMatch){
  const legs=[]; let k=1;
  for(const c of pool.slice(skip)){
    if(uniqueMatch && legs.some(l=>l.matchId===c.matchId)) continue;
    if(legs.some(l=>l.matchId===c.matchId && l.market===c.market)) continue;
    const next=k*c.odds; if(next>cap) continue;
    legs.push(c); k=next;
    if(legs.length>=nLegs && k>=minK) break;
    if(legs.length>=12) break;
  }
  k=productOdds(legs);
  if(legs.length<2||k<minK||k>cap) return null;
  return legs;
}

  const slips=[];

function parseCourt(ev, live){
  const history=[]; let games=[0,0]; let points=["0","0"];
  const scores=Array.isArray(ev.scores)?ev.scores:[];
  let scoreGames=[0,0];
  scores.forEach((s,i)=>{
    const ga=setGamesVal(s.score_first), gb=setGamesVal(s.score_second);
    const last=i===scores.length-1;
    if(live && last){games=[ga,gb]; scoreGames=[ga,gb];}
    else if(ga||gb) history.push([ga,gb]);
  });
  const pbp=Array.isArray(ev.pointbypoint)?ev.pointbypoint:[];
  if(pbp.length){
    const last=pbp[pbp.length-1];
    const setKey=String(last.set_number||"");
    const same=pbp.filter(g=>String(g.set_number||"")===setKey);
    const cur=same[same.length-1]||last;
    const done=!!(cur.serve_winner||cur.serve_lost);
    const prev=done?cur:same[same.length-2];
    if(prev && prev.score){
      const p=pairScore(prev.score);
      games=[num(p[0]),num(p[1])];
    }else if(!done) games=[0,0];
    const lastPt=((cur.points)||[]).slice(-1)[0];
    if(!done && lastPt && lastPt.score){
      const p=pairScore(lastPt.score);
      points=[p[0],p[1]];
    }else if(done) points=["0","0"];
    const setIdx=Math.max(0, parseInt(String(setKey).replace(/\D/g,""),10)-1);
    if((scoreGames[0]+scoreGames[1])>(games[0]+games[1])) games=scoreGames;
  }
  const gr=String(ev.event_game_result||"");
  if(gr && gr!=="-" && points[0]==="0" && points[1]==="0"){
    const p=pairScore(gr);
    if(!(p[0]==="0"&&p[1]==="0"&&(games[0]+games[1]>0))) points=[p[0],p[1]];
  }
  return {history,games,points};
}

    const old=by[m.id];
    if(!old){by[m.id]=m; continue}
    if(m.status==="upcoming" && old.status==="live") continue;
    if(m.status==="finished" && old.status==="live") logFinish(Object.assign({},old,m));
    if(isFav(m.id) && old.status==="live"){
      const a=String(old.sets)+String(old.games), b=String(m.sets)+String(m.games);

        }

    by[m.id]=Object.assign({},old,m);
  }

    const liveIds=new Set(incomingLive.map(m=>String(m.id)));

    for(const id of Object.keys(by)){
      const cur=by[id];
      if(cur.status==="finished"||cur.complete){delete by[id]; continue}
      if(cur.status==="live" && incomingLive.length && !liveIds.has(String(id))){
        state.miss=state.miss||{};

        state.miss[String(id)]=n;

  for(const m of incoming||[]){
    if(!m||(m.sport||"tennis")!=="tennis") continue;
    if(m.status==="finished"||m.complete){delete by[String(m.id)]; continue}
    const old=by[String(m.id)];
    if(!old){watchCourt(null,m); by[String(m.id)]=m; continue}
    if(m.status==="upcoming" && old.status==="live") continue;
    watchCourt(old,m);
    old.status=m.status;
    old.sets=m.sets;
    old.games=m.games;
    old.pointLabel=m.pointLabel;
    old.setHistory=m.setHistory;
    old.server=m.server;
    old.complete=!!m.complete;
    old.stats=m.stats||old.stats;
    old.seen=Date.now();
  }
  const all=Object.values(by).filter(m=>m.status!=="finished"&&!m.complete);
  all.forEach(rememberMatch);
  state.board={matches:all, liveCount:all.filter(x=>x.status==="live").length, fetchedAt:Date.now()};
  state.lastOk=Date.now();
  return true;
}
function parseFeeds(feeds){
  const by={}, rank={live:0,upcoming:1,finished:2};
  for(const feed of feeds){
    for(const stage of (feed&&feed.Stages)||[]){
      for(const ev of stage.Events||[]){
        const snap=mapEvent(ev,stage); if(!snap) continue;
        const prev=by[snap.id];
        if(!prev||rank[snap.status]<=rank[prev.status]) by[snap.id]=snap;
      }
    }
  }
  return Object.values(by);
}
async function loadBoard(kind){
  const lock=kind==="live"?"fetchLive":"fetchFull";
  if(state[lock]) return false;
  state[lock]=true;
  try{
    let incoming=[];
    if(state.sport==="football"){
      incoming=await loadFootball(kind);
    }else{
      incoming=await loadTennis(kind);
    }
    if(!incoming.length && state.sport!=="football"){
      const urls=kind==="live"
        ?["https://prod-public-api.livescore.com/v1/api/app/live/tennis/0"]
        :[
          "https://prod-public-api.livescore.com/v1/api/app/live/tennis/0",
          "https://prod-public-api.livescore.com/v1/api/app/date/tennis/"+ymd(0)+"/0",
          "https://prod-public-api.livescore.com/v1/api/app/date/tennis/"+ymd(1)+"/0"
        ];
      incoming=parseFeeds(await Promise.all(urls.map(fetchJson)));
    }
    incoming.forEach(rememberMatch);
    if(!incoming.length){
      if(!state.board){
        try{state.board=JSON.parse(localStorage.getItem("tennisai.board."+state.sport)||"null")}catch{}
      }
      if(!state.board) state.board={matches:[],liveCount:0};
      return false;
    }
    state.board=mergeBoard(incoming, kind);
    state.lastOk=Date.now();
    try{localStorage.setItem("tennisai.board."+state.sport,JSON.stringify(state.board))}catch{}
    if(state.sport!=="football") enrichBoard().then(()=>patchScores());
    else patchScores();
    state.failStreak=0;
    return true;
  }catch{
    if(!state.board){
      try{state.board=JSON.parse(localStorage.getItem("tennisai.board")||"null")}catch{}
    }
    if(!state.board) state.board={matches:[],liveCount:0};
    return false;
  }finally{state[lock]=false}
}

function momentumPoints(m,ev){
  const pts=[]; let y=50;
  for(let i=0;i<24;i++){
    const target=ev.p1;
    y=y+(target-y)*0.18+(Math.sin(i/2.4)*3);
    pts.push(clamp(y,8,92));
  }
  if(m.status==="live") pts[pts.length-1]=ev.p1;
  return pts;
}

function drawMom(m,ev){
  const c=$("#mom"); if(!c) return;
  const dpr=Math.min(2,devicePixelRatio||1);
  const w=c.parentElement.clientWidth-8, h=140;
  c.width=w*dpr; c.height=h*dpr; c.style.width=w+"px";
  const ctx=c.getContext("2d"); ctx.scale(dpr,dpr);
  const pts=momentumPoints(m,ev);
  ctx.strokeStyle="#2a3140"; ctx.lineWidth=1;
  [25,50,75].forEach(p=>{ctx.beginPath();ctx.moveTo(0,h-p/100*h);ctx.lineTo(w,h-p/100*h);ctx.stroke()});
  const line=(arr,color)=>{
    ctx.beginPath(); ctx.strokeStyle=color; ctx.lineWidth=2;
    arr.forEach((y,i)=>{const x=i/(arr.length-1)*w, yy=h-y/100*h; i?ctx.lineTo(x,yy):ctx.moveTo(x,yy)});
    ctx.stroke();
  };
  line(pts,"#22c55e");
  line(pts.map(y=>100-y),"#ef4444");
  ctx.fillStyle="#8b91a1"; ctx.font="11px system-ui";
  ctx.fillText(m.short1,8,14); ctx.fillText(m.short2,w-ctx.measureText(m.short2).width-8,14);
}

      if(sp){
        const next=sp.getAttribute("data-sport");
        if(next===state.sport) return;
        state.boards[state.sport]=state.board;
        state.sport=next;
        try{localStorage.setItem("tennisai.sport",next)}catch{}
        let b=state.boards[next];
        try{if(!b||!b.matches) b=JSON.parse(localStorage.getItem("tennisai.board."+next)||"null")}catch{}
        const rows=(b&&b.matches||[]).filter(m=>(m.sport||"tennis")===next);
        state.board={matches:rows,liveCount:rows.filter(x=>x.status==="live").length};
        state.filter="ALL"; state.exLevel="ALL"; state.exTour="ALL"; state.express=null; state.lastIds="";
        render();
        loadBoard("full").then(()=>{refreshView(true)});
        return;
      }
      const w=e.target.closest("[data-watch]");
      if(w){e.preventDefault();e.stopPropagation();openWatch(w.getAttribute("data-watch"));return}
      const fv=e.target.closest("[data-fav]");
      if(fv){e.preventDefault();e.stopPropagation();toggleFav(fv.getAttribute("data-fav"));render();return}
      if(e.target.closest("[data-notes-clear]")){state.notes=[];persistNotes();render();return}
      if(e.target.closest("[data-db-export]")){
        Promise.all(["matches","preds","results","players"].map(dbAll)).then(([matches,preds,results,players])=>{
          const blob=new Blob([JSON.stringify({matches,preds,results,players,t:Date.now()},null,2)],{type:"application/json"});
          const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="tennisai-db.json"; a.click();
        });
        return;
      }
      if(e.target.closest("[data-edit-prof]")){state.editProf=true;render();return}
      if(e.target.closest("[data-close-edit]")){state.editProf=false;render();return}
      const pref=e.target.closest("[data-pref-tour]");
      if(pref && state.user){state.user.tour=pref.getAttribute("data-pref-tour");saveUser(state.user);render();return}
      const tg=e.target.closest("[data-toggle]");
      if(tg && state.user){
        const k=tg.getAttribute("data-toggle");
        state.user[k]=k==="liveOn"?!(state.user.liveOn!==false):!state.user[k];
        if(k==="pushOn" && state.user.pushOn && typeof Notification!=="undefined" && Notification.permission==="default"){
          Notification.requestPermission();
        }
        saveUser(state.user);render();return;
      }
      const evw=e.target.closest("[data-exview]");
      if(evw) state.exView=evw.getAttribute("data-exview");
      const go=e.target.closest("[data-go]");
      if(go){e.preventDefault();e.stopPropagation();navigate(go.getAttribute("data-go"));return}
      if(evw){render();return}
      const f=e.target.closest("[data-filter]");
      if(f){state.filter=f.getAttribute("data-filter");render();return}
      const lv=e.target.closest("[data-level]");
      if(lv){state.exLevel=lv.getAttribute("data-level")||"ALL";state.exTour="ALL";state.express=null;buildExpress();render();return}
      const t=e.target.closest("[data-tour]");
      if(t){state.exTour=t.getAttribute("data-tour")||"ALL";state.express=null;buildExpress();render();return}
      const tab=e.target.closest("[data-tab]");
      if(tab){state.tab=tab.getAttribute("data-tab");render();return}
      const pick=e.target.closest("[data-pick]");
      if(pick){
        const [mode,id]=String(pick.getAttribute("data-pick")||"").split(":");
        const slip=mode==="mine"?(state.mine||[]).find(x=>String(x.sid)===id):(state.express?.slips||[]).find(x=>String(x.id)===id);
        if(slip){pickMine(slip);alert("Экспресс выбран: "+slip.title+" · кф "+Number(slip.odds).toFixed(2));render()}
        return;
      }
      const sv=e.target.closest("[data-save]");
      if(sv){
        const id=sv.getAttribute("data-save");
        const slip=(state.express?.slips||[]).find(x=>String(x.id)===id)||state.express?.slips?.[0];
        if(slip&&saveMine(slip)){pickMine(state.mine[0]);alert("Сохранено в Мои экспрессы");render()}
        return;
      }
      const del=e.target.closest("[data-del]");
      if(del){delMine(del.getAttribute("data-del"));render()}
    });
  }
  $("#sheet-close")?.addEventListener("click",closeWatch);
  $("#sheet")?.addEventListener("click",e=>{if(e.target.id==="sheet") closeWatch()});
  $("#logout")?.addEventListener("click",()=>{saveUser(null);render()});
  $("#edit-prof")?.addEventListener("submit",e=>{
    e.preventDefault();
    if(!state.user) return;
    const fd=new FormData(e.target);
    const name=String(fd.get("name")||"").trim();
    const email=String(fd.get("email")||"").trim().toLowerCase();
    if(!name||!email) return;
    state.user.name=name; state.user.email=email; state.editProf=false;
    saveUser(state.user); render();
  });
  $("#auth-form")?.addEventListener("submit",e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    const email=String(fd.get("email")||"").trim().toLowerCase();
    const password=String(fd.get("password")||"");
    const name=String(fd.get("name")||email.split("@")[0]);
    const db=usersDB();
    if((state.path||"").includes("register")){
      if(db.some(u=>u.email===email)){state.authError="Такой email уже есть";render();return}
      db.push({email,name,pass:hash(password)});
      localStorage.setItem("tennisai.users",JSON.stringify(db));
      saveUser({email,name}); state.authError=""; navigate("/profile"); return;
    }
    const hit=db.find(u=>u.email===email&&u.pass===hash(password));
    if(!hit){state.authError="Неверная почта или пароль";render();return}
    saveUser({email:hit.email,name:hit.name}); state.authError=""; navigate("/profile");
  });
  const m=(state.board?.matches||[]).find(x=>x.id===state.matchId);
  if(m) drawMom(m,evaluate(m));
}

function parse(){
  let h=state.path || location.hash.slice(1) || "/home";
  h=String(h).replace(/^#/,"");
  if(h[0]!=="/") h="/"+h;
  state.path=h;
  if(h.startsWith("/match/")){state.route="match";state.matchId=decodeURIComponent(h.slice(7));return}
  if(h.startsWith("/matches")) state.route="matches";
  else if(h.startsWith("/favs")||h.startsWith("/fav")) state.route="favs";
  else if(h.startsWith("/notes")) state.route="notes";
  else if(h.startsWith("/express")) state.route="express";
  else if(h.startsWith("/profile")||h.startsWith("/register")||h.startsWith("/login")) state.route="profile";
  else state.route="home";
}
function render(){
  parse();
  const y=window.scrollY;
  const root=$("#app");
  root.innerHTML=state.route==="match"?renderMatch()
    :state.route==="matches"?renderMatches()
    :state.route==="favs"?renderFavs()
    :state.route==="notes"?renderNotes()
    :state.route==="express"?renderExpress()
    :state.route==="profile"?renderProfile()
    :renderHome();
  if(state.route==="notes") markNotesRead();
  if(state.route==="profile") refreshDbStats();
  bind();
  state.lastIds=idsKey();
  window.scrollTo(0,y);
  if(state.route==="match") askGrok(findMatch(state.matchId));
}
function refreshView(force){
  if(force){render();return}
  patchScores();
  const key=idsKey();
  if(key!==state.lastIds){
    state.lastIds=key;
    const list=$("#live-list");
    const feat=featured();
    const live=sportMatches().filter(m=>m.status==="live");
    if(list){
      const rows=(live.length?live.filter(m=>state.filter==="ALL"||m.tour===state.filter):filtered()).slice(0,12);
      list.innerHTML=rows.length?rows.map(matchCard).join(""):`<div class="empty">Нет текущих матчей</div>`;
    }
    const n=$("#live-n");
    if(n) n.textContent=live.length?"LIVE · "+live.length:"БЛИЖАЙШИЕ";
  }
}

const WELCOME=[
  {title:"Live как на корте", text:"Счёт сетов, геймов и очков обновляется сам. ИИ сразу показывает, кого брать: П1 сверху, П2 снизу.", art:`<div class="glow"></div><div class="wcard"><div class="row"><span>Александрова Е</span><b>6</b></div><div class="row"><span>Таусон К</span><b>5</b></div><div class="note">П2 · 55%</div></div>`},
  {title:"Экспресс дня", text:"ИИ собирает 3 купона: победы, тоталы и максимум коэффициента. У каждого события есть турнир и понятная ставка.", art:`<div class="glow"></div><div class="wcard"><div class="lbl">МАКСИМУМ КФ</div><div style="font-size:32px;font-weight:800;margin:8px 0">кф 50+</div><div class="note">Тотал · сет · точный счёт</div></div>`},
  {title:"Имена по-русски", text:"Игроки и турниры как у букмекера. Открыл — сразу понял, на кого ставка.", art:`<div class="glow"></div><span class="fly">🎾</span><div class="wcard"><div class="row"><span>Синнер Я</span><span class="ai">П1</span></div><div class="row"><span>Алькарас К</span><span class="note">П2</span></div></div>`}
];
function closeGate(){
  try{localStorage.setItem("tennisai.onboard","1")}catch{}
  const g=$("#gate"); if(!g) return;
  g.classList.add("out");
  setTimeout(()=>{g.remove()},560);
}
function showWelcome(step){
  const w=$("#welcome"), s=$("#splash");
  if(s) s.style.display="none";
  if(!w){closeGate();return}
  w.classList.add("on");
  const sl=WELCOME[step]||WELCOME[0];
  const art=$("#w-art"), t=$("#w-title"), tx=$("#w-text"), d=$("#w-dots"), n=$("#w-next");
  if(art) art.innerHTML=sl.art;
  if(t) t.textContent=sl.title;
  if(tx) tx.textContent=sl.text;
  if(d) d.innerHTML=WELCOME.map((_,i)=>`<b class="${i===step?"on":""}"></b>`).join("");
  if(n) n.textContent=step>=WELCOME.length-1?"НАЧАТЬ":"ДАЛЬШЕ";
  w.dataset.step=String(step);
}
function initGate(){
  const splash=$("#splash-logo");
  if(splash) splash.innerHTML=logoMark(92);
  let step=0;
  $("#w-next")?.addEventListener("click",()=>{
    step+=1;
    if(step>=WELCOME.length) closeGate();
    else showWelcome(step);
  });
  $("#w-skip")?.addEventListener("click",closeGate);
  let seen=false;
  try{seen=localStorage.getItem("tennisai.onboard")==="1"}catch{}
  setTimeout(()=>{
    if(seen) closeGate();
    else showWelcome(0);
  }, seen?1200:1700);
}

(async function start(){
  loadUser();
  brainLoad();
  loadXai();
  loadJournal();
  loadFavs();
  dbReady().then(()=>refreshDbStats());
  cloudPull();
  try{state.sport=localStorage.getItem("tennisai.sport")||"tennis"}catch{}
  try{
    const cached=JSON.parse(localStorage.getItem("tennisai.board."+state.sport)||"null");
    const age=Date.now()-(cached&&cached.fetchedAt||0);
    const ghost=(cached&&cached.source==="boot")||(cached&&cached.matches||[]).some(m=>/1878915|1880776|Zheng|Pridankina|Alexandrova/.test(String(m.id)+m.p1+m.p2));
    if(cached?.matches?.length && age<20*60*1000 && !ghost){
      cached.matches=cached.matches.filter(m=>m.status!=="finished"&&!m.complete);
      state.board=cached;
    }else{
      try{localStorage.removeItem("tennisai.board."+state.sport)}catch{}
    }
  }catch{}
  initGate();
  buildExpress();
  render();
  await loadBoard("full");
  render();
  const visible=()=>document.visibilityState!=="hidden";
  const liveDelay=()=>{
    if(!visible()) return 20000;
    const liveN=sportMatches().filter(m=>m.status==="live").length;
    if(state.sport==="football" && !liveN) return 12000;
    const f=state.failStreak||0;
    if(f>=8) return 20000;
    if(f>=4) return 8000;
    return state.sport==="football"?4000:1000;
  };
  const fullDelay=()=>visible()?50000:120000;
  const pumpLive=async()=>{
    if(state.fetchLive) return;
    try{
      if(state.sport==="football"){
        const ok=await loadBoard("live");
        if(ok){state.failStreak=0; refreshView(false);}
        else state.failStreak=(state.failStreak||0)+1;
        return;
      }
      state.fetchLive=true;
      const rows=await fetchApi("get_livescore");
      const open=state.matchId;
      const incoming=(rows||[]).map(ev=>mapTennisEvent(ev, String(ev.event_key)!==String(open))).filter(Boolean);
      if(incoming.length){
        applyLiveTennis(incoming);
        state.failStreak=0;
        if(Date.now()-(state.lastSave||0)>12000){
          state.lastSave=Date.now();
          try{localStorage.setItem("tennisai.board.tennis",JSON.stringify(state.board))}catch{}
        }
        refreshView(false);
      }else if(Array.isArray(rows)){
        state.lastOk=Date.now();
      }else state.failStreak=(state.failStreak||0)+1;
    }catch{state.failStreak=(state.failStreak||0)+1}
    finally{if(state.sport!=="football") state.fetchLive=false}
  };
  const pumpFull=async()=>{
    if(state.fetchFull) return;
    try{
      const ok=await loadBoard("full");
      if(ok) refreshView(false);
    }catch{}
  };
  const armLive=()=>{
    clearTimeout(state._liveT);
    state._liveT=setTimeout(()=>{pumpLive(); armLive();}, liveDelay());
  };
  const armFull=()=>{
    clearTimeout(state._fullT);
    state._fullT=setTimeout(async()=>{await pumpFull(); armFull();}, fullDelay());
  };
  setInterval(()=>{
    const m=(state.board?.matches||[]).find(x=>x.id===state.matchId);
    const clk=$("#clk"); if(clk&&m) clk.textContent=clock(m);
    if(Date.now()-(state.lastOk||0)>8000){
      state.fetchLive=false; state.fetchFull=false;
      pumpLive();
    }
  },2000);
  setInterval(()=>{if(visible() && state.sport!=="football") enrichBoard().then(()=>patchScores());},20000);
  document.addEventListener("visibilitychange",()=>{
    if(visible()){state.failStreak=0; pumpLive(); armLive(); armFull();}
  });
  window.addEventListener("online",()=>{state.failStreak=0; pumpLive();});
  window.addEventListener("pageshow",()=>{pumpLive();});
  window.addEventListener("hashchange",()=>{
    state.path=location.hash.slice(1)||"/home";
    render();
  });
  let lastTap=0;
  document.addEventListener("touchend",()=>{
    if(Date.now()-lastTap<8000) return;
    lastTap=Date.now();
    if(document.visibilityState!=="hidden") pumpLive();
  },{passive:true});
  pumpLive();
  armLive();
  armFull();
})();
</script>
